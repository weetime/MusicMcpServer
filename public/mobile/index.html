<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MusicEcho - Discover and play music (Mobile)</title>
    <!-- Modular CSS -->
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/results.css">
    <link rel="stylesheet" href="css/player.css">
    <link rel="stylesheet" href="css/player-bar.css">
    <link rel="stylesheet" href="css/lyrics.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/instruments.css">
    <link rel="stylesheet" href="css/bottom-nav.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Fixed Top Header -->
    <header class="fixed-header">
        <div class="header-content">
            <h1 class="title">MusicEcho</h1>
        </div>
    </header>

    <!-- Fixed Top Search Bar -->
    <div class="fixed-search-bar">
        <div class="search-bar-wrapper">
            <div class="search-bar-container">
                <div class="search-icon-wrapper">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </div>
                <input 
                    type="text" 
                    id="songInput" 
                    class="search-bar-input" 
                    placeholder="想播放什么?"
                    autocomplete="off"
                    aria-label="搜索歌曲名称"
                >
                <button id="searchBtn" class="search-bar-btn" aria-label="搜索">Search</button>
            </div>
            <!-- Search History Dropdown -->
            <div id="searchHistory" class="search-history-dropdown hidden">
                <div class="search-history-header">
                    <span>最近搜索</span>
                    <button id="clearHistoryBtn" class="clear-history-btn">清除</button>
                </div>
                <div id="searchHistoryList" class="search-history-list"></div>
            </div>
        </div>
        <div class="search-options-bar">
            <input 
                type="text" 
                id="artistInput" 
                class="search-option-input" 
                placeholder="Artist (optional)"
                autocomplete="off"
                aria-label="艺术家名称（可选）"
            >
            <select id="qualitySelect" class="search-option-select" title="Audio Quality" aria-label="音质选择">
                <option value="standard">Standard</option>
                <option value="higher">Higher</option>
                <option value="exhigh" selected>Extremely High</option>
                <option value="lossless">Lossless</option>
                <option value="hires">Hi-Res</option>
            </select>
        </div>
    </div>

    <div class="container">
        <!-- Loading Overlay -->
        <div id="loadingIndicator" class="loading-overlay hidden">
            <div class="loading-content">
                <div class="spinner"></div>
                <p>Searching...</p>
            </div>
        </div>

        <!-- Search Results -->
        <div id="searchResults" class="search-results hidden">
            <div class="results-header">
                <h2 class="results-title">Search Results</h2>
                <span id="resultsCount" class="results-count">0 results</span>
            </div>
            <div class="results-wrapper">
                <div id="resultsList" class="results-grid"></div>
            </div>
            <!-- Pagination Container -->
            <div id="paginationContainer" class="pagination-container"></div>
        </div>
    </div>

    <!-- Fixed Center Player Bar -->
    <div id="musicPlayer" class="music-player-bar hidden">
        <audio id="audioPlayer" preload="metadata"></audio>
        
        <div class="player-bar-left">
            <div class="player-bar-album-art">
                <img id="albumArt" src="" alt="Album Art" class="album-art-thumb">
            </div>
            <div class="player-bar-track-info">
                <div id="trackName" class="player-bar-track-name">Song Name</div>
                <div id="trackArtist" class="player-bar-track-artist">Artist</div>
            </div>
        </div>
        
        <div class="player-bar-right">
            <button id="playPauseBtn" class="player-bar-play-btn" title="Play/Pause">
                <span id="playPauseIcon">▶</span>
            </button>
            <button class="player-bar-queue-btn" title="Playlist">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

    <!-- Lyrics Panel -->
    <div 
        id="lyricsPanel" 
        class="lyrics-panel hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="lyricsTitle"
    >
        <div class="lyrics-header">
            <h2 id="lyricsTitle" class="lyrics-title">歌词</h2>
            <button 
                id="lyricsCloseBtn" 
                class="lyrics-close-btn" 
                title="Close lyrics"
                aria-label="关闭歌词面板"
            >
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div id="lyricsContainer" class="lyrics-container">
            <div class="lyrics-empty">暂无歌词</div>
        </div>
    </div>

    <!-- Fixed Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button class="nav-item active" id="navHome" aria-label="首页">
            <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span class="nav-label">首页</span>
        </button>
        <button class="nav-item" id="navInstruments" aria-label="乐器">
            <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18V5l12-2v13"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="18" cy="16" r="3"></circle>
            </svg>
            <span class="nav-label">乐器</span>
        </button>
        <button class="nav-item" id="navTheme" aria-label="主题">
            <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
            <span class="nav-label">主题</span>
        </button>
    </nav>

    <!-- Instruments Dropdown (moved from header) -->
    <div 
        id="instrumentsDropdown" 
        class="instruments-dropdown hidden"
        role="menu"
        aria-labelledby="navInstruments"
    >
        <div class="instruments-dropdown-content" id="instrumentsContent"></div>
    </div>

    <!-- Theme Dropdown (moved from header) -->
    <div 
        id="themeDropdown" 
        class="theme-dropdown-bottom hidden"
        role="menu"
        aria-labelledby="navTheme"
    >
        <div class="theme-dropdown-header">
            <span>选择主题</span>
        </div>
        <div class="theme-list" id="themeList" role="listbox"></div>
    </div>

    <!-- Playlist Dropdown (for player bar queue button) -->
    <div 
        id="playlistDropdown" 
        class="playlist-dropdown playlist-dropdown-bottom hidden"
        role="menu"
    >
        <div class="playlist-header">
            <span>播放列表</span>
            <span id="playlistCount" class="playlist-count">0 首</span>
        </div>
        <div id="playlistList" class="playlist-list"></div>
    </div>

    <!-- Modular JavaScript -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
