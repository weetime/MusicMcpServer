<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicCore - Discover and play music</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Fixed Top Header -->
    <header class="fixed-header">
        <div class="header-content">
            <h1 class="title">MusicCore</h1>
            <p class="subtitle">Discover and play music powered by Netease Cloud Music</p>
        </div>
    </header>

    <!-- Fixed Top Search Bar -->
    <div class="fixed-search-bar">
        <div class="search-bar-wrapper">
            <div class="search-bar-container">
                <div class="search-icon-wrapper">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </div>
                <input 
                    type="text" 
                    id="songInput" 
                    class="search-bar-input" 
                    placeholder="想播放什么?"
                    autocomplete="off"
                >
                <button id="searchBtn" class="search-bar-btn">Search</button>
            </div>
            <!-- Search History Dropdown -->
            <div id="searchHistory" class="search-history-dropdown hidden">
                <div class="search-history-header">
                    <span>最近搜索</span>
                    <button id="clearHistoryBtn" class="clear-history-btn">清除</button>
                </div>
                <div id="searchHistoryList" class="search-history-list"></div>
            </div>
        </div>
        <div class="search-options-bar">
            <input 
                type="text" 
                id="artistInput" 
                class="search-option-input" 
                placeholder="Artist (optional)"
                autocomplete="off"
            >
            <select id="qualitySelect" class="search-option-select" title="Audio Quality">
                <option value="standard">Standard</option>
                <option value="higher">Higher</option>
                <option value="exhigh" selected>Extremely High</option>
                <option value="lossless">Lossless</option>
                <option value="hires">Hi-Res</option>
            </select>
        </div>
    </div>

    <div class="container">

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="loading-indicator hidden">
            <div class="spinner"></div>
            <p>Searching...</p>
        </div>

        <!-- Search Results -->
        <div id="searchResults" class="search-results hidden">
            <div class="results-header">
                <h2 class="results-title">Search Results</h2>
                <span id="resultsCount" class="results-count">0 results</span>
            </div>
            <div id="resultsList" class="results-grid"></div>
        </div>
    </div>

    <!-- Fixed Bottom Player -->
    <div id="musicPlayer" class="music-player hidden">
        <audio id="audioPlayer" preload="metadata"></audio>
        
        <div class="player-left">
            <div class="player-album-art">
                <img id="albumArt" src="" alt="Album Art" class="album-art-thumb">
            </div>
            <div class="player-track-info">
                <div id="trackName" class="player-track-name">Song Name</div>
                <div id="trackArtist" class="player-track-artist">Artist</div>
            </div>
            <button class="player-add-btn" title="Add to playlist">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </div>
        
        <div class="player-center">
            <div class="player-controls-main">
                <button class="player-control-btn shuffle-btn" title="Shuffle">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="16 3 21 3 21 8"></polyline>
                        <line x1="4" y1="20" x2="21" y2="3"></line>
                        <polyline points="21 16 21 21 16 21"></polyline>
                        <line x1="15" y1="15" x2="21" y2="21"></line>
                        <line x1="4" y1="4" x2="9" y2="9"></line>
                    </svg>
                </button>
                <button class="player-control-btn prev-btn" title="Previous">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="19 20 9 12 19 4 19 20"></polygon>
                        <line x1="5" y1="19" x2="5" y2="5"></line>
                    </svg>
                </button>
                <button id="playPauseBtn" class="player-control-btn play-btn-main" title="Play/Pause">
                    <span id="playPauseIcon">▶</span>
                </button>
                <button class="player-control-btn next-btn" title="Next">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 4 15 12 5 20 5 4"></polygon>
                        <line x1="19" y1="5" x2="19" y2="19"></line>
                    </svg>
                </button>
                <button class="player-control-btn repeat-btn" title="Repeat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="17 1 21 5 17 9"></polyline>
                        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                        <polyline points="7 23 3 19 7 15"></polyline>
                        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                    </svg>
                </button>
            </div>
            <div class="player-progress-container">
                <span id="currentTime" class="player-time">0:00</span>
                <input 
                    type="range" 
                    id="progressBar" 
                    class="player-progress-bar" 
                    min="0" 
                    max="100" 
                    value="0"
                >
                <span id="duration" class="player-time">0:00</span>
            </div>
        </div>
        
        <div class="player-right">
            <button class="player-icon-btn" title="Queue">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
            </button>
            <div class="player-volume-container">
                <button class="player-icon-btn volume-btn" title="Volume">
                    <svg id="volumeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                </button>
                <input 
                    type="range" 
                    id="volumeBar" 
                    class="player-volume-bar" 
                    min="0" 
                    max="100" 
                    value="70"
                >
            </div>
            <button id="closePlayer" class="player-icon-btn" title="Close player">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
