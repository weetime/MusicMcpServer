<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicEcho - Discover and play music (PC)</title>
    <!-- Modular CSS -->
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/results.css">
    <link rel="stylesheet" href="css/player.css">
    <link rel="stylesheet" href="css/lyrics.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/instruments.css">
    <link rel="stylesheet" href="css/pagination.css">
</head>
<body>
    <!-- Fixed Top Header -->
    <header class="fixed-header">
        <div class="header-content">
            <h1 class="title">MusicEcho</h1>
            <p class="subtitle">Discover and play music powered by Netease Cloud Music</p>
        </div>
        <div class="header-actions">
            <div class="instruments-selector">
                <button 
                    id="instrumentsBtn" 
                    class="instruments-btn" 
                    title="乐器频道"
                    aria-label="打开乐器频道"
                    aria-expanded="false"
                    aria-haspopup="true"
                >
                    <span class="instruments-btn-text">🎼 乐器频道</span>
                </button>
                <div 
                    id="instrumentsDropdown" 
                    class="instruments-dropdown hidden"
                    role="menu"
                    aria-labelledby="instrumentsBtn"
                >
                    <div class="instruments-dropdown-content" id="instrumentsContent"></div>
                </div>
            </div>
            <div class="theme-selector">
                <button 
                    id="themeBtn" 
                    class="theme-btn" 
                    title="Change Theme"
                    aria-label="切换主题"
                    aria-expanded="false"
                    aria-haspopup="true"
                >
                    <svg class="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                    </svg>
                </button>
                <div 
                    id="themeDropdown" 
                    class="theme-dropdown hidden"
                    role="menu"
                    aria-labelledby="themeBtn"
                >
                    <div class="theme-dropdown-header">
                        <span>选择主题</span>
                    </div>
                    <div class="theme-list" id="themeList" role="listbox"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- Fixed Top Search Bar -->
    <div class="fixed-search-bar">
        <div class="search-bar-wrapper">
            <div class="search-bar-container">
                <div class="search-icon-wrapper">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </div>
                <input 
                    type="text" 
                    id="songInput" 
                    class="search-bar-input" 
                    placeholder="想播放什么?"
                    autocomplete="off"
                    aria-label="搜索歌曲名称"
                >
                <button id="searchBtn" class="search-bar-btn" aria-label="搜索">Search</button>
            </div>
            <!-- Search History Dropdown -->
            <div id="searchHistory" class="search-history-dropdown hidden">
                <div class="search-history-header">
                    <span>最近搜索</span>
                    <button id="clearHistoryBtn" class="clear-history-btn">清除</button>
                </div>
                <div id="searchHistoryList" class="search-history-list"></div>
            </div>
        </div>
        <div class="search-options-bar">
            <input 
                type="text" 
                id="artistInput" 
                class="search-option-input" 
                placeholder="Artist (optional)"
                autocomplete="off"
                aria-label="艺术家名称（可选）"
            >
            <select id="qualitySelect" class="search-option-select" title="Audio Quality" aria-label="音质选择">
                <option value="standard">Standard</option>
                <option value="higher">Higher</option>
                <option value="exhigh" selected>Extremely High</option>
                <option value="lossless">Lossless</option>
                <option value="hires">Hi-Res</option>
            </select>
        </div>
    </div>

    <div class="container">
        <!-- Loading Overlay -->
        <div id="loadingIndicator" class="loading-overlay hidden">
            <div class="loading-content">
                <div class="spinner"></div>
                <p>Searching...</p>
            </div>
        </div>

        <!-- Search Results -->
        <div id="searchResults" class="search-results hidden">
            <div class="results-header">
                <h2 class="results-title">Search Results</h2>
                <span id="resultsCount" class="results-count">0 results</span>
            </div>
            <div class="results-wrapper">
                <button id="prevPageBtn" class="results-nav-btn results-nav-prev" title="Previous Page">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="19 20 9 12 19 4 19 20"></polygon>
                        <line x1="5" y1="19" x2="5" y2="5"></line>
                    </svg>
                </button>
                <div id="resultsList" class="results-grid"></div>
                <button id="nextPageBtn" class="results-nav-btn results-nav-next" title="Next Page">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 4 15 12 5 20 5 4"></polygon>
                        <line x1="19" y1="5" x2="19" y2="19"></line>
                    </svg>
                </button>
            </div>
            <!-- Pagination Container -->
            <div id="paginationContainer" class="pagination-container"></div>
        </div>
    </div>

    <!-- Fixed Bottom Player -->
    <div id="musicPlayer" class="music-player hidden">
        <audio id="audioPlayer" preload="metadata"></audio>
        
        <div class="player-left">
            <div class="player-album-art">
                <img id="albumArt" src="" alt="Album Art" class="album-art-thumb">
            </div>
            <div class="player-track-info">
                <div id="trackName" class="player-track-name">Song Name</div>
                <div id="trackArtist" class="player-track-artist">Artist</div>
            </div>
        </div>
        
        <div class="player-center">
            <div class="player-controls-main">
                <button id="shuffleBtn" class="player-control-btn shuffle-btn" title="Shuffle">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="16 3 21 3 21 8"></polyline>
                        <line x1="4" y1="20" x2="21" y2="3"></line>
                        <polyline points="21 16 21 21 16 21"></polyline>
                        <line x1="15" y1="15" x2="21" y2="21"></line>
                        <line x1="4" y1="4" x2="9" y2="9"></line>
                    </svg>
                </button>
                <button class="player-control-btn prev-btn" title="Previous">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="19 20 9 12 19 4 19 20"></polygon>
                        <line x1="5" y1="19" x2="5" y2="5"></line>
                    </svg>
                </button>
                <button id="playPauseBtn" class="player-control-btn play-btn-main" title="Play/Pause">
                    <span id="playPauseIcon">▶</span>
                </button>
                <button class="player-control-btn next-btn" title="Next">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 4 15 12 5 20 5 4"></polygon>
                        <line x1="19" y1="5" x2="19" y2="19"></line>
                    </svg>
                </button>
                <button id="repeatBtn" class="player-control-btn repeat-btn" title="Repeat Off">
                    <svg id="repeatIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="17 1 21 5 17 9"></polyline>
                        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                        <polyline points="7 23 3 19 7 15"></polyline>
                        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                    </svg>
                </button>
            </div>
            <div class="player-progress-container">
                <span id="currentTime" class="player-time">0:00</span>
                <input 
                    type="range" 
                    id="progressBar" 
                    class="player-progress-bar" 
                    min="0" 
                    max="100" 
                    value="0"
                >
                <span id="duration" class="player-time">0:00</span>
            </div>
        </div>
        
        <div class="player-right">
            <button id="queueBtn" class="player-icon-btn" title="Queue">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
            </button>
            <!-- Playlist Dropdown -->
            <div id="playlistDropdown" class="playlist-dropdown hidden">
                <div class="playlist-header">
                    <span>播放列表</span>
                    <span id="playlistCount" class="playlist-count">0 首</span>
                </div>
                <div id="playlistList" class="playlist-list"></div>
            </div>
            <button id="lyricsBtn" class="player-icon-btn lyrics-btn" title="Lyrics">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
            </button>
            <div class="player-volume-container">
                <button class="player-icon-btn volume-btn" title="Volume">
                    <svg id="volumeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                </button>
                <input 
                    type="range" 
                    id="volumeBar" 
                    class="player-volume-bar" 
                    min="0" 
                    max="100" 
                    value="70"
                >
            </div>
            <button id="closePlayer" class="player-icon-btn" title="Close player">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

    <!-- Lyrics Panel -->
    <div 
        id="lyricsPanel" 
        class="lyrics-panel hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="lyricsTitle"
    >
        <div class="lyrics-header">
            <h2 id="lyricsTitle" class="lyrics-title">歌词</h2>
            <button 
                id="lyricsCloseBtn" 
                class="lyrics-close-btn" 
                title="Close lyrics"
                aria-label="关闭歌词面板"
            >
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div id="lyricsContainer" class="lyrics-container">
            <div class="lyrics-empty">暂无歌词</div>
        </div>
    </div>

    <!-- Modular JavaScript -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
